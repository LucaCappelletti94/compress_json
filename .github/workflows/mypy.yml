name: MyPy Check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  mypy:
    runs-on: ubuntu-26.04
    container: python:3.9
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          pip install ".[test]"
          pip install mypy  # Ensure mypy is installed

      - name: Run MyPy
        run: mypy compress_json/
